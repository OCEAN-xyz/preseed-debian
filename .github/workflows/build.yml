name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  amd64:
    runs-on: ubuntu-latest
    container: debian:stable

    steps:
      - uses: actions/checkout@v7

      - name: build the amd64 image
        run: |
          apt-get update && apt-get install -y xorriso wget gzip apt-utils cpio curl
          ./build.sh -c amd64

      - uses: actions/upload-artifact@v7
        with:
          name: DATUM-box-amd64.iso
          path: DATUM-box-amd64.iso

  arm64:
    runs-on: ubuntu-latest
    container: debian:stable

    steps:
      - uses: actions/checkout@v7

      - name: build the arm64 image
        run: |
          apt-get update && apt-get install -y xorriso wget gzip apt-utils cpio curl
          ./build.sh -c arm64

      - uses: actions/upload-artifact@v7
        with:
          name: DATUM-box-arm64.iso
          path: DATUM-box-arm64.iso
